name: medicine_reminder_app
description: 100% on-device medication reminder app — visual pill inventory, drag & drop scheduling, and scan-to-dismiss verification. No backend, no cloud services.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ---- Local-only storage (NoSQL, on-device) ----
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # ---- Camera & local image handling ----
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.7            # crop/manipulate photos locally, no server round trip

  # ---- On-device ML (Google ML Kit — runs on-device, no network calls) ----
  google_mlkit_object_detection: ^0.13.0   # pill bounding-box extraction
  google_mlkit_text_recognition: ^0.11.0   # label OCR -> auto schedule
  mobile_scanner: ^4.0.1                   # live QR/barcode camera UI

  # ---- Local notifications / alarms (device-scheduled only) ----
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # ---- State, ids, dates ----
  provider: ^6.1.1
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
